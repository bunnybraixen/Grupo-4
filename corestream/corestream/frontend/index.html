<!DOCTYPE html>
<!--
  Punto de entrada HTML para la aplicación CoreStream

  Este archivo es el punto de partida para la aplicación Vue 3.
  Vite inyectará automáticamente el script main.ts en este archivo durante el desarrollo.
  El div con id="app" es donde Vue 3 montará la aplicación.
-->
<html lang="es">
<head>
  <!-- Codificación de caracteres: UTF-8 para soportar caracteres especiales -->
  <meta charset="UTF-8" />
  
  <!-- Viewport: optimización para dispositivos móviles y responsividad -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Título de la aplicación -->
  <title>CoreStream - Plataforma de Gestión de Proyectos</title>
</head>
<body>
  <!--
    Elemento raíz donde Vue 3 montará la aplicación
    Vue reemplazará este div con el componente App.vue
  -->
  <div id="app"></div>

  <!--
    Script de entrada principal
    Vite inyectará este módulo automáticamente durante el desarrollo
    En producción, este será compilado y optimizado
  -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
