name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancela ejecuciones anteriores de la misma rama: no tiene sentido gastar
# runners validando un commit que ya ha sido reemplazado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend · lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Mypy
        working-directory: backend
        # Todavía no está limpio en todo el árbol; se amplía por módulos.
        continue-on-error: true
        run: mypy app

  backend-unit:
    name: Backend · tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (unitarios, sin servicios externos)
        working-directory: backend
        run: pytest tests --ignore=tests/integration -q

  backend-integration:
    name: Backend · tests de integración
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: corestream
          POSTGRES_PASSWORD: corestream
          POSTGRES_DB: corestream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corestream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://corestream:corestream@localhost:5432/corestream_test
      TEST_REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: clave-de-ci-no-usar-en-produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (integración, contra PostgreSQL y Redis reales)
        working-directory: backend
        # Los xfail conocidos están documentados con la fase del plan que los
        # resuelve. Son strict: si uno se arregla, el test da XPASS y falla el
        # CI hasta que se retire la marca. Así el avance es medible.
        run: pytest tests/integration -q

  migraciones:
    name: Backend · una sola cabeza de Alembic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar que no hay cabezas múltiples
        working-directory: backend
        run: |
          CABEZAS=$(alembic heads | grep -c "(head)" || true)
          echo "cabezas encontradas: $CABEZAS"
          if [ "$CABEZAS" -ne 1 ]; then
            echo "::error::Se esperaba exactamente una cabeza de Alembic, hay $CABEZAS."
            alembic heads
            exit 1
          fi

  frontend:
    name: Frontend · tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Comprobación de tipos
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Tests unitarios
        working-directory: frontend
        run: npx vitest run --passWithNoTests

      - name: Build de producción
        working-directory: frontend
        run: npm run build
