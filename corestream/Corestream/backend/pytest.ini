[pytest]
asyncio_mode = auto

# Los tests de integración comparten un único bucle de eventos y un cliente HTTP
# de ámbito de sesión: levantar la aplicación con su lifespan en cada test sería
# innecesariamente lento.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests
addopts = --tb=short -v

markers =
    integration: requiere PostgreSQL y Redis reales (tests/integration)
