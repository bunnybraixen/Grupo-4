# Nginx interno del contenedor de frontend: sirve la build estática de Vue
# y hace fallback de rutas al index.html (enrutado de cliente con Vue Router).
#
# Esto NO es el Nginx público de la VM (ese lo configura el encargado de
# sistemas y hace proxy_pass hacia este contenedor — ver docs/DEPLOYMENT.md).
# Este Nginx solo ve tráfico ya llegado desde el proxy de la VM.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad (plan 3.2). style-src permite 'unsafe-inline'
    # porque Vue renderiza bindings :style como atributos style="" en el
    # elemento — no hay una alternativa práctica sin nonce por render.
    #
    # OJO: add_header NO se hereda de server{} a location{} si el location
    # define sus propios add_header (gotcha clásico de Nginx) — por eso estas
    # cuatro líneas se repiten en cada location en vez de declararse una sola
    # vez aquí arriba.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Assets con hash en el nombre (Vite): cacheable indefinidamente.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        try_files $uri $uri/ /index.html;
        # index.html y el resto de rutas: sin caché, para que un despliegue
        # nuevo se vea sin que el navegador sirva una versión vieja.
        add_header Cache-Control "no-cache";
    }
}
